name: Nouvelle feature
description: Décrivez une idée en quelques lignes, l'agent vous posera ses questions ici.
title: "Feature : "
labels: ["factory:feature"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Votre idée
      description: Ce que vous voulez pouvoir faire, avec vos mots. Pas besoin d'être complet.
      placeholder: "Je veux pouvoir cocher mes habitudes chaque jour et voir ma série en cours."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Pourquoi (facultatif)
      description: À quoi ça vous servira, pour aider l'agent à faire les bons choix.
