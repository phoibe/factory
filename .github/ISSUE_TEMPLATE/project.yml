name: Cadrage du projet (nouveau ou révision)
description: Avant la première feature, ou plus tard pour changer la vision, le périmètre, le design ou la stack. L'agent ne refait jamais les fondations d'un projet déjà cadré.
title: "Cadrage : "
labels: ["factory:project"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Votre idée d'appli, ou ce que vous voulez changer
      description: "Nouveau projet : pour qui, pour quoi faire, en vrac, avec vos mots. Révision : ce que vous voulez changer et pourquoi."
      placeholder: "Une appli pour suivre mes habitudes : je coche ce que j'ai fait chaque jour et je vois mes séries."
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Contraintes ou envies (facultatif)
      description: Sur mobile surtout ? Des comptes ? Des données à partager ?
  - type: textarea
    id: look
    attributes:
      label: Le look que vous imaginez (facultatif)
      description: Des applis, sites ou objets dont vous aimez l'allure, et ceux que vous n'aimez pas. L'agent vous posera de toute façon ses questions design.
      placeholder: "J'aime le calme de Things et les couleurs de Duolingo ; je n'aime pas les applis bancaires grises."
