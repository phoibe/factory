name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Chat server tests
        working-directory: server/chat
        run: |
          pip install -q "fastapi[standard]==0.115.12" httpx==0.28.1
          python -m unittest -v
