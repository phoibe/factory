# Monthly: proposes the latest model versions of the catalog and the public prices as a pull request.
name: Mise à jour des modèles
on:
  schedule:
    - cron: '23 6 1 * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/models.mjs --latest
      - run: node --test
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- scripts/lib/models.mjs scripts/lib/prices.mjs; then echo "Modèles et tarifs déjà à jour"; exit 0; fi
          branch="models-update-$(date +%Y-%m)"
          {
            if ! git diff --quiet -- scripts/lib/models.mjs; then
              echo "Les versions des familles de modèles proposées dans les réglages ont changé :"
              echo
              git diff -U0 -- scripts/lib/models.mjs | grep -E "^[+-]  \{ id:" | sed -E "s/^([+-])  \{ id: '([^']+)', name: '[^']*', version: '([^']+)'.*/\1 \2 \3/"
              echo
            fi
            if ! git diff --quiet -- scripts/lib/prices.mjs; then
              echo "Les tarifs publics utilisés par la page « Consommation » ont changé (dollars par million de tokens : entrée / sortie / lecture du cache) :"
              echo
              git diff -U0 -- scripts/lib/prices.mjs | grep -E "^[+-]  \{ model:" | sed -E "s/^([+-])  \{ model: '([^']+)', input: ([^,]+), output: ([^,]+), cacheRead: ([^,]+),.*/\1 \2 \3 \/ \4 \/ \5/"
              echo
            fi
            echo "Rien d'autre ne change : le choix des modèles de chaque rôle reste le vôtre."
          } > "$RUNNER_TEMP/pr-body.md"
          git config user.name "factory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add scripts/lib/models.mjs scripts/lib/prices.mjs
          git commit -m "chore: update model catalog and prices"
          git push -f origin "$branch"
          gh pr create --title "Mise à jour mensuelle des modèles" --body-file "$RUNNER_TEMP/pr-body.md" --head "$branch" \
            || gh pr edit "$branch" --body-file "$RUNNER_TEMP/pr-body.md" \
            || echo "::warning::Activez « Allow GitHub Actions to create and approve pull requests » dans Settings → Actions → General."
