# Reusable orchestrator. Called by .github/workflows/factory.yml in every project (see phoibe/factory-template).
name: Factory relay
on:
  workflow_call:
    inputs:
      factory_ref:
        description: Branch or tag of phoibe/factory to use
        type: string
        default: stable
    secrets:
      FACTORY_ROUTINE_URL:
        required: false
      FACTORY_ROUTINE_TOKEN:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      NTFY_TOPIC:
        required: false

jobs:
  decide:
    # No `concurrency` here: GitHub keeps one waiting run per group and cancels the others, which lost events.
    # Runs queue up on a repository-wide lock instead (scripts/lib/lock.mjs), one decision at a time.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
      deployments: read
      actions: write
    outputs:
      checks: ${{ steps.relay.outputs.checks }}
      pr: ${{ steps.relay.outputs.pr }}
      agent: ${{ steps.relay.outputs.agent }}
      payload: ${{ steps.relay.outputs.payload }}
      preview: ${{ steps.relay.outputs.preview }}
      production: ${{ steps.relay.outputs.production }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: phoibe/factory
          ref: ${{ inputs.factory_ref }}
          path: .factory-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: relay
        run: node .factory-src/scripts/relay.mjs decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FACTORY_ROUTINE_URL: ${{ secrets.FACTORY_ROUTINE_URL }}
          FACTORY_ROUTINE_TOKEN: ${{ secrets.FACTORY_ROUTINE_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      # GitHub's rate limit stopped the relay: this run fails here and the next tick re-runs it (scripts/relay.mjs).
      - name: 'Rate limited: retried at the next tick'
        if: steps.relay.outputs.ratelimited == 'true'
        run: exit 1

  # Fallback runner (runner: "github-actions" in factory.config.json). Runs in a workflow_dispatch run started by the relay.
  agent:
    needs: decide
    if: needs.decide.outputs.agent == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: '*'
          prompt: |
            Tu es l'agent de la software factory de ce dépôt. Voici le JSON de ce run :
            ${{ needs.decide.outputs.payload }}
            Lis .factory/AGENT.md, puis suis l'étape indiquée dans "stage".
          claude_args: >-
            --max-turns 300
            --allowedTools "Bash,Read,Edit,Write,MultiEdit,Glob,Grep,WebFetch,WebSearch,Task,Skill,TodoWrite"

  # Releases the lock if the agent did not, and asks for a replay of messages written during the run.
  release:
    needs: [decide, agent]
    if: always() && needs.decide.outputs.agent == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: phoibe/factory
          ref: ${{ inputs.factory_ref }}
          path: .factory-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: release
        run: node .factory-src/scripts/relay.mjs release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAYLOAD: ${{ needs.decide.outputs.payload }}
      # GitHub's rate limit stopped the relay: this run fails here and the next tick re-runs it (scripts/relay.mjs).
      - name: 'Rate limited: retried at the next tick'
        if: steps.release.outputs.ratelimited == 'true'
        run: exit 1

  checks:
    needs: decide
    if: needs.decide.outputs.checks == 'true'
    concurrency:
      group: factory-checks-${{ github.repository }}-${{ needs.decide.outputs.pr }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.head.outputs.sha }}
      started: ${{ steps.head.outputs.started }}
      # « true » when the checks failed on a passing outage (network, GitHub), not on the code: see lib/outage.mjs.
      transient: ${{ steps.run.outputs.transient || steps.outage.outputs.transient }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ needs.decide.outputs.pr }}/head
      - id: head
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Rules from the default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if content=$(gh api "repos/$GITHUB_REPOSITORY/contents/factory.config.json" --jq .content 2> "$RUNNER_TEMP/err"); then
            printf '%s' "$content" | base64 -d > "$RUNNER_TEMP/factory.config.json"
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/err"; then
            echo '{}' > "$RUNNER_TEMP/factory.config.json"
          else
            cat "$RUNNER_TEMP/err"; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: phoibe/factory
          ref: ${{ inputs.factory_ref }}
          path: .factory-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: run
        run: node .factory-src/scripts/checks.mjs . --config "$RUNNER_TEMP/factory.config.json"
      # A failure before the checks could even start (checkout, rules, Node download) is never the code's fault.
      - id: outage
        if: failure() && steps.run.outcome != 'failure'
        run: echo "transient=true" >> "$GITHUB_OUTPUT"

  report:
    needs: [decide, checks]
    if: always() && needs.decide.outputs.checks == 'true' && (needs.checks.result == 'success' || needs.checks.result == 'failure' || needs.checks.result == 'cancelled')
    # A newer report waits for the running one (a merge and what follows it is never cut in the middle), then runs.
    concurrency:
      group: factory-report-${{ github.repository }}-${{ needs.decide.outputs.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
      deployments: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: phoibe/factory
          ref: ${{ inputs.factory_ref }}
          path: .factory-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: report
        run: node .factory-src/scripts/relay.mjs report --result "$RESULT" --pr "$PR" --sha "$SHA" --started "$STARTED" --transient "$TRANSIENT"
        env:
          RESULT: ${{ needs.checks.result }}
          PR: ${{ needs.decide.outputs.pr }}
          SHA: ${{ needs.checks.outputs.sha }}
          STARTED: ${{ needs.checks.outputs.started }}
          TRANSIENT: ${{ needs.checks.outputs.transient }}
          GITHUB_TOKEN: ${{ github.token }}
          FACTORY_ROUTINE_URL: ${{ secrets.FACTORY_ROUTINE_URL }}
          FACTORY_ROUTINE_TOKEN: ${{ secrets.FACTORY_ROUTINE_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      # GitHub's rate limit stopped the relay: this run fails here and the next tick re-runs it (scripts/relay.mjs).
      - name: 'Rate limited: retried at the next tick'
        if: steps.report.outputs.ratelimited == 'true'
        run: exit 1

  # Before the owner is given a preview to test, the factory opens it like a visitor (read-only page loads, see
  # scripts/smoke.mjs). A broken or empty preview goes back to the agent; then the report goes on as usual.
  # Opening it runs the project's own dependencies (Playwright from its node_modules): that job may only read, with
  # no credentials left behind; the result travels as an artifact to the job that writes.
  preview-open:
    needs: decide
    if: needs.decide.outputs.preview != ''
    runs-on: ubuntu-24.04
    # The wait for the preview (5 min), then its opening (12).
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: read
      issues: read
      pull-requests: read
    outputs:
      url: ${{ steps.wait.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(needs.decide.outputs.preview).sha }}
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: phoibe/factory
          ref: ${{ inputs.factory_ref }}
          path: .factory-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The host can take minutes to publish the preview: waited for here, outside the queue lock (issue #212).
      - id: wait
        name: Wait for the preview
        run: node .factory-src/scripts/relay.mjs preview-url
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECK: ${{ needs.decide.outputs.preview }}
      - name: Open the preview
        if: steps.wait.outputs.url != ''
        continue-on-error: true
        timeout-minutes: 12
        env:
          PREVIEW_URL: ${{ steps.wait.outputs.url }}
        run: node .factory-src/scripts/smoke.mjs --url "$PREVIEW_URL" --dir project --out "$RUNNER_TEMP/smoke/smoke.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-preview
          path: ${{ runner.temp }}/smoke/
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true

  preview:
    needs: [decide, preview-open]
    if: always() && needs.decide.outputs.preview != ''
    runs-on: ubuntu-24.04
    # The report and the alert, each waiting its turn on the queue lock (13 at worst, seconds in practice).
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      deployments: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: phoibe/factory
          ref: ${{ inputs.factory_ref }}
          path: .factory-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: smoke-preview
          path: ${{ runner.temp }}/smoke
      - name: Report
        run: node .factory-src/scripts/relay.mjs preview-report --result-file "$RUNNER_TEMP/smoke/smoke.json" --url "$PREVIEW_URL"
        env:
          PREVIEW_URL: ${{ needs.preview-open.outputs.url }}
          GITHUB_TOKEN: ${{ github.token }}
          CHECK: ${{ needs.decide.outputs.preview }}
          FACTORY_ROUTINE_URL: ${{ secrets.FACTORY_ROUTINE_URL }}
          FACTORY_ROUTINE_TOKEN: ${{ secrets.FACTORY_ROUTINE_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

  # After a merge: once the host has deployed it, the live site is opened the same way (read-only job, as for the
  # preview). If it does not work, the delivery is undone at once and an urgent bug redoes it properly
  # (relay.mjs prodReport).
  production-open:
    needs: decide
    if: needs.decide.outputs.production != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      deployments: read
    outputs:
      url: ${{ steps.live.outputs.url }}
      deployFailed: ${{ steps.live.outputs.deployFailed }}
      deployFailure: ${{ steps.live.outputs.deployFailure }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: phoibe/factory
          ref: ${{ inputs.factory_ref }}
          path: .factory-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: live
        name: Wait for the new version
        run: node .factory-src/scripts/relay.mjs live-url
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECK: ${{ needs.decide.outputs.production }}
      - uses: actions/checkout@v4
        if: steps.live.outputs.url != ''
        with:
          ref: ${{ fromJSON(needs.decide.outputs.production).sha }}
          path: project
          persist-credentials: false
      # Checked again for about 5 minutes before a failure counts: a site still being published answers 404 (#227).
      - name: Open the live site
        if: steps.live.outputs.url != ''
        continue-on-error: true
        timeout-minutes: 20
        env:
          URL: ${{ steps.live.outputs.url }}
        run: node .factory-src/scripts/smoke.mjs --url "$URL" --dir project --out "$RUNNER_TEMP/smoke/smoke.json" --retry-minutes 5
      - uses: actions/upload-artifact@v4
        if: always() && steps.live.outputs.url != ''
        with:
          name: smoke-production
          path: ${{ runner.temp }}/smoke/
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true

  production:
    needs: [decide, production-open]
    if: always() && needs.decide.outputs.production != '' && (needs.production-open.outputs.url != '' || needs.production-open.outputs.deployFailed == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      deployments: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: phoibe/factory
          ref: ${{ inputs.factory_ref }}
          path: .factory-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The project is checked out here only for git (an undo commit), never to run its code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(needs.decide.outputs.production).sha }}
          path: project
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: smoke-production
          path: ${{ runner.temp }}/smoke
      - name: Report
        run: node .factory-src/scripts/relay.mjs prod-report --result-file "$RUNNER_TEMP/smoke/smoke.json" --url "$URL" --deploy-failed "$DEPLOY_FAILED" --dir project
        env:
          URL: ${{ needs.production-open.outputs.url }}
          DEPLOY_FAILED: ${{ needs.production-open.outputs.deployFailed }}
          DEPLOY_FAILURE: ${{ needs.production-open.outputs.deployFailure }}
          GITHUB_TOKEN: ${{ github.token }}
          CHECK: ${{ needs.decide.outputs.production }}
          FACTORY_ROUTINE_URL: ${{ secrets.FACTORY_ROUTINE_URL }}
          FACTORY_ROUTINE_TOKEN: ${{ secrets.FACTORY_ROUTINE_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
