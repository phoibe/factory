# Packages the double-click setup files (outils/) into a zip attached to the « outils » release, so the
# owner downloads them in one click: https://github.com/phoibe/factory/releases/download/outils/factory-outils.zip
name: Outils
on:
  push:
    branches: [main]
    paths: ['outils/**', '.github/workflows/outils.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip (keeps the executable bit, so a double-click runs them)
        run: |
          chmod +x outils/*.command
          zip -X -r factory-outils.zip outils
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view outils >/dev/null 2>&1; then
            gh release upload outils factory-outils.zip --clobber
          else
            gh release create outils factory-outils.zip --latest=false --title "Outils de la factory (Mac)" \
              --notes "Téléchargez factory-outils.zip, décompressez-le, puis double-cliquez « Nouveau projet » ou « Adopter un projet »."
          fi
