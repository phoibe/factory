# « Déclarer stable » (button in the panel, or Run workflow here): runs the tests on main and, if they pass,
# moves the `stable` branch that every project follows to main, with a numbered release listing the changes.
# Every hour it also does so on its own, once main has run an hour on the factory itself without trouble
# (the factory follows main: it tries each version before the projects; see scripts/stable.mjs ready).
name: Déclarer stable
on:
  issues:
    types: [opened]
  workflow_dispatch:
  schedule:
    - cron: '41 * * * *'
permissions:
  contents: write
  issues: write
concurrency:
  group: factory-stable
  cancel-in-progress: false
jobs:
  promote:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (contains(github.event.issue.labels.*.name, 'factory:release') && github.event.sender.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: ready
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/stable.mjs ready
      - id: tests
        if: github.event_name != 'schedule' || steps.ready.outputs.ready == 'true'
        run: node --test
      - name: Promote
        id: promote
        if: github.event_name != 'schedule' || steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/stable.mjs notes > "$RUNNER_TEMP/notes.md"
          tag=$(node scripts/stable.mjs tag)
          git tag "$tag"
          for i in 1 2 3 4; do { git push origin "$tag" || git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; } && break; [ $i = 4 ] && exit 1; echo "GitHub a refusé l'envoi, nouvel essai dans $((i*10)) s"; sleep $((i*10)); done
          for i in 1 2 3 4; do git push --force origin HEAD:refs/heads/stable && break; [ $i = 4 ] && exit 1; echo "GitHub a refusé l'envoi, nouvel essai dans $((i*10)) s"; sleep $((i*10)); done
          gh release create "$tag" --title "Version stable $tag" --notes-file "$RUNNER_TEMP/notes.md" --latest
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Tell the owner
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
          TAG: ${{ steps.promote.outputs.tag }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$TAG" ]; then
            msg="C'est fait ✅ La version stable est maintenant **$TAG** : tous les projets la prennent à leur prochain run. Le détail des changements : ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
          else
            msg="Rien n'a changé ❌ Un test de la factory est rouge, donc la version stable reste la précédente. Le détail : $RUN"
          fi
          gh issue comment "$N" --repo "$GITHUB_REPOSITORY" --body "$msg

          ---
          _Message automatique de la software factory_"
          gh issue close "$N" --repo "$GITHUB_REPOSITORY"
