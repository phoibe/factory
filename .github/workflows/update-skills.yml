# Monthly: proposes the latest version of every skill pack as a pull request.
name: Mise à jour des skills
on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/vendor.mjs --latest
      - run: node --test
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A packs
          # Only the sources' pins moved (upstream commits outside the vendored skills): nothing to propose.
          if git diff --cached --quiet -- packs ':!packs/catalog.json' ':!packs/sources.json' ':!packs/NOTICE.md'; then echo "Skills déjà à jour"; exit 0; fi
          branch="skills-update-$(date +%Y-%m)"
          git config user.name "factory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A packs
          git commit -m "chore: update vendored skill packs"
          node scripts/lib/skills-update-body.mjs HEAD~1 > "$RUNNER_TEMP/pr-body.md"
          git push -f origin "$branch"
          gh pr create --title "Mise à jour mensuelle des skills" --body-file "$RUNNER_TEMP/pr-body.md" --head "$branch" \
            || gh pr edit "$branch" --body-file "$RUNNER_TEMP/pr-body.md" \
            || echo "::warning::Activez « Allow GitHub Actions to create and approve pull requests » dans Settings → Actions → General."
