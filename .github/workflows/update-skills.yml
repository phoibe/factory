# Monthly: proposes the latest version of every skill pack as a pull request.
name: Mise à jour des skills
on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/vendor.mjs --latest
      - run: node --test
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A packs
          if git diff --cached --quiet; then echo "Skills déjà à jour"; exit 0; fi
          branch="skills-update-$(date +%Y-%m)"
          git config user.name "factory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A packs
          git commit -m "chore: update vendored skill packs"
          git push -f origin "$branch"
          changed=$(git diff --name-only HEAD~1 -- packs | grep SKILL.md | sed -E 's#packs/([^/]+)/([^/]+)/.*#- \1 : \2#' | sort -u)
          body=$(printf "Nouvelle version des skills de la factory.\n\nSkills modifiés :\n%s\n\nLes tests de la factory passent. Fusionnez cette PR pour que vos projets utilisent ces versions à leur prochaine synchro.\n" "$changed")
          gh pr create --title "Mise à jour mensuelle des skills" --body "$body" --head "$branch" || echo "::warning::Active « Allow GitHub Actions to create and approve pull requests » dans Settings → Actions → General."
