name: Panneau
on:
  push:
    branches: [main]
    paths: ['panel/**', 'packs/catalog.json', 'defaults/**', 'scripts/lib/config-core.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p _site
          cp -r panel/* _site/
          cp packs/catalog.json defaults/factory.config.json scripts/lib/config-core.mjs _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
